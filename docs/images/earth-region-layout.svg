<title id="title">Odyssey — Earth region layout</title><desc id="desc">Creator-facing schematic, not to scale. Landing grasslands connect north to woods and lake, west to ridge and caves, southwest to jungle, southeast to desert, and south to coast and ocean. Mountain and tundra lie north. Dashed lines indicate later exploration routes.</desc>
